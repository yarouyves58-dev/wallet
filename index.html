<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Wallet – Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #0b1a2e, #0e1e34);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .app-container {
            max-width: 1200px;
            width: 100%;
            background: rgba(18, 30, 51, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 36px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.08);
            padding: 28px 32px;
            border: 1px solid rgba(90, 140, 200, 0.25);
            color: #eef4ff;
        }
        h1, h2, h3 {
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        h1 {
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        h1 span {
            background: linear-gradient(135deg, #4f9cf7, #a0c8ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .badge {
            background: #1f3a5f;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #9fc1ff;
            border: 1px solid #2f5580;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 28px;
            margin-top: 24px;
        }
        .card {
            background: rgba(12, 24, 40, 0.8);
            border-radius: 28px;
            padding: 26px 24px;
            border: 1px solid #1f3855;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
        }
        .wallet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .balance {
            font-size: 3rem;
            font-weight: 600;
            line-height: 1.2;
            background: linear-gradient(135deg, #c3dcff, #a0c0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            word-break: break-word;
        }
        .small-label {
            font-size: 0.85rem;
            color: #86a6d4;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .address-box {
            background: #0a1322;
            border-radius: 18px;
            padding: 18px 16px;
            border: 1px solid #1f3c5e;
            margin: 18px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.15s;
        }
        .address-box:hover {
            border-color: #3f72b0;
            background: #0d1729;
        }
        .address-text {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.95rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #b8d2ff;
            cursor: pointer;
            margin-right: 12px;
            flex: 1;
        }
        button {
            background: #2a4b7a;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid #3c6ea0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        button:hover {
            background: #346198;
            border-color: #5b8fd4;
            transform: scale(0.97);
        }
        button.secondary {
            background: #1a2e4a;
            border-color: #2e4c74;
        }
        button.secondary:hover {
            background: #253d5e;
        }
        button.danger {
            background: #5b2e3a;
            border-color: #9f5060;
        }
        button.danger:hover {
            background: #7d3e4e;
        }
        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 18px;
        }
        input, select {
            background: #0c1a2b;
            border: 1px solid #284b73;
            border-radius: 40px;
            padding: 14px 20px;
            font-size: 0.95rem;
            color: #eef4ff;
            width: 100%;
            outline: none;
            transition: 0.2s;
        }
        input:focus, select:focus {
            border-color: #5080c0;
            box-shadow: 0 0 0 3px rgba(80, 128, 192, 0.3);
        }
        input::placeholder {
            color: #5c7ea0;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #9bb9e0;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .auth-toggle {
            display: flex;
            gap: 16px;
            margin-bottom: 28px;
            border-bottom: 1px solid #1f3855;
            padding-bottom: 12px;
        }
        .auth-toggle button {
            background: transparent;
            border: none;
            box-shadow: none;
            color: #7b9bc8;
            font-size: 1.2rem;
            padding: 8px 0;
            border-radius: 0;
            border-bottom: 3px solid transparent;
        }
        .auth-toggle button.active {
            color: white;
            border-bottom-color: #4f9cf7;
        }
        .auth-toggle button:hover {
            transform: none;
            background: transparent;
            color: #b0ccff;
        }
        .hidden {
            display: none !important;
        }
        .transaction-list {
            max-height: 180px;
            overflow-y: auto;
            margin-top: 16px;
            padding-right: 6px;
            font-size: 0.9rem;
        }
        .transaction-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #1f3147;
        }
        .transaction-item:last-child {
            border-bottom: none;
        }
        .tx-positive {
            color: #6fcf97;
        }
        .tx-negative {
            color: #e66767;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e3a5f;
            padding: 14px 28px;
            border-radius: 60px;
            border-left: 6px solid #4f9cf7;
            color: white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            font-weight: 500;
            z-index: 999;
            transition: 0.3s;
            font-size: 0.95rem;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mt-3 {
            margin-top: 18px;
        }
        .mono {
            font-family: 'SF Mono', 'Fira Code', monospace;
            background: #0a121f;
            padding: 2px 8px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #b8d2ff;
        }
        .logout-btn {
            background: transparent;
            border: 1px solid #3b577b;
            color: #b0c6e0;
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0d1a2b;
        }
        ::-webkit-scrollbar-thumb {
            background: #2f5580;
            border-radius: 10px;
        }
        @media (max-width: 800px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .app-container {
                padding: 20px;
            }
            .balance {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <!-- L'application s'affiche ici -->
    </div>

    <script>
        // ============================================================
        //  SIMULATION DE PORTEFEUILLE ÉLECTRONIQUE
        //  Stockage : fichier JSON côté "navigateur" (localStorage)
        //  Compte démo : demo@wallet.com / demo123
        //  Solde initial : 2 000 000 000 €
        // ============================================================

        const STORAGE_KEY = 'ewallet_data';
        const DEMO_BALANCE = 2000000000; // 2 milliards d'euros
        const DEMO_EMAIL = 'demo@wallet.com';
        const DEMO_PASSWORD = 'demo123';
        const DEMO_ADDRESS = 'EW-DEMO-8A3F-9C21-7B4E';

        // ---------- INITIALISATION DU STOCKAGE ----------
        function loadData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);

                    // 🔄 MIGRATION : si le compte démo existe encore avec l'ancien solde (10M€),
                    // on le met à jour vers 2 milliards €.
                    if (parsed && parsed.users) {
                        const demo = parsed.users.find(u => u.email === DEMO_EMAIL);
                        if (demo && demo.balance === 10000000) {
                            demo.balance = DEMO_BALANCE;
                            localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed, null, 2));
                        }
                    }
                    return parsed;
                } catch (e) {
                    console.warn('Erreur de lecture JSON, réinitialisation.');
                }
            }
            // Données par défaut
            return {
                users: [
                    {
                        id: 'u_demo',
                        email: DEMO_EMAIL,
                        password: DEMO_PASSWORD,
                        address: DEMO_ADDRESS,
                        balance: DEMO_BALANCE,
                        transactions: []
                    }
                ],
                currentUserId: null
            };
        }

        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data, null, 2));
        }

        // Initialisation
        let walletData = loadData();
        if (!walletData.users || walletData.users.length === 0) {
            walletData.users = [{
                id: 'u_demo',
                email: DEMO_EMAIL,
                password: DEMO_PASSWORD,
                address: DEMO_ADDRESS,
                balance: DEMO_BALANCE,
                transactions: []
            }];
            saveData(walletData);
        }

        // ---------- GÉNÉRATION D'ADRESSE UNIQUE ----------
        function generateAddress() {
            const hex = '0123456789ABCDEF';
            const segment = (len) => Array.from({ length: len }, () => hex[Math.floor(Math.random() * 16)]).join('');
            return `EW-${segment(4)}-${segment(4)}-${segment(4)}-${segment(4)}`;
        }

        // ---------- AFFICHAGE PRINCIPAL ----------
        const app = document.getElementById('appContainer');

        function render() {
            const currentUser = getCurrentUser();
            if (currentUser) {
                renderDashboard(currentUser);
            } else {
                renderAuth();
            }
        }

        function getCurrentUser() {
            if (!walletData.currentUserId) return null;
            return walletData.users.find(u => u.id === walletData.currentUserId) || null;
        }

        // ---------- VUE AUTHENTIFICATION ----------
        let authMode = 'login';

        function renderAuth() {
            app.innerHTML = `
                <h1><span>E-Wallet</span></h1>
                <div class="grid" style="grid-template-columns: 1fr 1.2fr;">
                    <div class="card">
                        <div class="auth-toggle">
                            <button id="tabLogin" class="${authMode === 'login' ? 'active' : ''}">Connexion</button>
                            <button id="tabRegister" class="${authMode === 'register' ? 'active' : ''}">Inscription</button>
                        </div>
                        <div id="authFormContainer">
                            ${authMode === 'login' ? renderLoginForm() : renderRegisterForm()}
                        </div>
                    </div>
                    
                        
            `;

            document.getElementById('tabLogin')?.addEventListener('click', () => {
                authMode = 'login';
                renderAuth();
            });
            document.getElementById('tabRegister')?.addEventListener('click', () => {
                authMode = 'register';
                renderAuth();
            });

            document.getElementById('loginForm')?.addEventListener('submit', handleLogin);
            document.getElementById('registerForm')?.addEventListener('submit', handleRegister);
        }

        function renderLoginForm() {
            return `
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" placeholder="${DEMO_EMAIL}" value="${DEMO_EMAIL}" required>
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" id="loginPassword" placeholder="${DEMO_PASSWORD}" value="${DEMO_PASSWORD}" required>
                    </div>
                    <button type="submit" style="width: 100%;">Se connecter</button>
                </form>
            `;
        }

        function renderRegisterForm() {
            return `
                <form id="registerForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="regEmail" placeholder="vous@exemple.com" required>
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" id="regPassword" placeholder="••••••••" minlength="4" required>
                    </div>
                    <div class="form-group">
                        <label>Confirmer le mot de passe</label>
                        <input type="password" id="regConfirm" placeholder="••••••••" minlength="4" required>
                    </div>
                    <button type="submit" style="width: 100%;">Créer un compte</button>
                </form>
            `;
        }

        // ---------- GESTION INSCRIPTION / CONNEXION ----------
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;

            const user = walletData.users.find(u => u.email === email && u.password === password);
            if (!user) {
                showToast('❌ Email ou mot de passe incorrect.', '#b33');
                return;
            }
            walletData.currentUserId = user.id;
            saveData(walletData);
            render();
            showToast(`✅ Bienvenue, ${user.email}`, '#1e5a3a');
        }

        function handleRegister(e) {
            e.preventDefault();
            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;

            if (!email || !password) {
                showToast('Veuillez remplir tous les champs.', '#b33');
                return;
            }
            if (password !== confirm) {
                showToast('Les mots de passe ne correspondent pas.', '#b33');
                return;
            }
            if (walletData.users.some(u => u.email === email)) {
                showToast('Cet email est déjà utilisé.', '#b33');
                return;
            }

            const newUser = {
                id: 'u_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                email: email,
                password: password,
                address: generateAddress(),
                balance: 0,
                transactions: []
            };
            walletData.users.push(newUser);
            saveData(walletData);
            showToast('✅ Compte créé ! Connectez-vous.', '#1e5a3a');
            authMode = 'login';
            renderAuth();
        }

        // ---------- TABLEAU DE BORD UTILISATEUR ----------
        function renderDashboard(user) {
            const formattedBalance = user.balance.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2 });
            app.innerHTML = `
                <div class="flex-between" style="margin-bottom: 20px;">
                    <h1><span>E-Wallet</span> <span class="badge">${user.email}</span></h1>
                    <button class="logout-btn" id="logoutBtn">Déconnexion</button>
                </div>
                <div class="grid">
                    <div class="card">
                        <div class="small-label">Solde disponible</div>
                        <div class="balance" id="balanceDisplay">${formattedBalance}</div>

                        <div class="address-box">
                            <div class="address-text" id="userAddress" title="Cliquez pour copier">${user.address}</div>
                            <button class="secondary" id="copyAddressBtn" style="padding: 8px 16px;">📋 Copier</button>
                        </div>

                        <div style="margin-top: 20px;">
                            <h3 style="font-weight: 400; margin-bottom: 12px;">💰 Envoyer de l'argent</h3>
                            <div class="form-group">
                                <input type="text" id="sendAddress" placeholder="Adresse du destinataire (EW-...)">
                            </div>
                            <div class="form-group">
                                <input type="number" id="sendAmount" placeholder="Montant en €" min="0.01" step="0.01">
                            </div>
                            <button id="sendBtn" style="width: 100%;">Envoyer</button>
                        </div>
                    </div>

                    <div class="card">
                        <div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: center; justify-content: space-between;">
                            <h3 style="font-weight: 400;">📥 Recevoir</h3>
                            <span style="font-size: 0.85rem; color: #86a6d4;">Partagez votre adresse</span>
                        </div>
                        <div class="address-box" style="margin-top: 12px;">
                            <div class="address-text" id="receiveAddress">${user.address}</div>
                            <button class="secondary" id="copyReceiveBtn" style="padding: 8px 16px;">📋</button>
                        </div>

                        <div style="margin-top: 28px;">
                            <h3 style="font-weight: 400; margin-bottom: 12px;">🏧 Retirer des fonds</h3>
                            <div class="form-group">
                                <input type="number" id="withdrawAmount" placeholder="Montant à retirer (€)" min="0.01" step="0.01">
                            </div>
                            <button id="withdrawBtn" class="danger" style="width: 100%;">Retirer vers un compte externe</button>
                            <p style="font-size: 0.8rem; color: #6b8bb0; margin-top: 8px;">Simulation : les fonds sont déduits immédiatement.</p>
                        </div>

                        <div style="margin-top: 28px;">
                            <h3 style="font-weight: 400; margin-bottom: 8px;">📜 Historique</h3>
                            <div class="transaction-list" id="transactionList">
                                ${renderTransactions(user.transactions)}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('logoutBtn').addEventListener('click', () => {
                walletData.currentUserId = null;
                saveData(walletData);
                render();
                showToast('Déconnecté.', '#2a4b7a');
            });

            const copyAddress = () => {
                navigator.clipboard.writeText(user.address).then(() => {
                    showToast('📋 Adresse copiée !', '#1e5a3a');
                }).catch(() => {
                    const el = document.createElement('textarea');
                    el.value = user.address;
                    document.body.appendChild(el);
                    el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);
                    showToast('📋 Adresse copiée !', '#1e5a3a');
                });
            };
            document.getElementById('copyAddressBtn')?.addEventListener('click', copyAddress);
            document.getElementById('copyReceiveBtn')?.addEventListener('click', copyAddress);
            document.getElementById('userAddress')?.addEventListener('click', copyAddress);
            document.getElementById('receiveAddress')?.addEventListener('click', copyAddress);

            document.getElementById('sendBtn').addEventListener('click', () => {
                const destAddress = document.getElementById('sendAddress').value.trim();
                const amount = parseFloat(document.getElementById('sendAmount').value);

                if (!destAddress) {
                    showToast('Veuillez saisir une adresse destinataire.', '#b33');
                    return;
                }
                if (isNaN(amount) || amount <= 0) {
                    showToast('Montant invalide.', '#b33');
                    return;
                }
                if (amount > user.balance) {
                    showToast('Solde insuffisant.', '#b33');
                    return;
                }

                const recipient = walletData.users.find(u => u.address === destAddress);
                if (!recipient) {
                    showToast('Adresse destinataire inconnue.', '#b33');
                    return;
                }
                if (recipient.id === user.id) {
                    showToast('Vous ne pouvez pas vous envoyer de l\'argent à vous-même.', '#b33');
                    return;
                }

                user.balance -= amount;
                recipient.balance += amount;

                const now = new Date().toISOString();
                user.transactions.push({
                    type: 'envoi',
                    amount: amount,
                    counterparty: recipient.address,
                    date: now,
                    description: `Envoi à ${recipient.email}`
                });
                recipient.transactions.push({
                    type: 'reception',
                    amount: amount,
                    counterparty: user.address,
                    date: now,
                    description: `Reçu de ${user.email}`
                });

                saveData(walletData);
                renderDashboard(user);
                showToast(`✅ ${amount.toFixed(2)} € envoyés à ${recipient.email}`, '#1e5a3a');
            });

            document.getElementById('withdrawBtn').addEventListener('click', () => {
                const amount = parseFloat(document.getElementById('withdrawAmount').value);
                if (isNaN(amount) || amount <= 0) {
                    showToast('Montant invalide.', '#b33');
                    return;
                }
                if (amount > user.balance) {
                    showToast('Solde insuffisant.', '#b33');
                    return;
                }
                user.balance -= amount;
                user.transactions.push({
                    type: 'retrait',
                    amount: amount,
                    counterparty: 'Compte externe',
                    date: new Date().toISOString(),
                    description: 'Retrait vers compte bancaire'
                });
                saveData(walletData);
                renderDashboard(user);
                showToast(`💸 ${amount.toFixed(2)} € retirés (simulation)`, '#b33');
            });
        }

        function renderTransactions(transactions) {
            if (!transactions || transactions.length === 0) {
                return '<div style="color: #5c7ea0; padding: 12px 0;">Aucune transaction pour le moment.</div>';
            }
            const sorted = [...transactions].reverse().slice(0, 10);
            return sorted.map(tx => {
                const sign = tx.type === 'reception' ? '+' : '-';
                const cls = tx.type === 'reception' ? 'tx-positive' : 'tx-negative';
                const date = new Date(tx.date).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
                const counterpartyShort = tx.counterparty.length > 20 ? tx.counterparty.slice(0, 18) + '…' : tx.counterparty;
                return `
                    <div class="transaction-item">
                        <div>
                            <div style="font-weight: 500;">${tx.type === 'envoi' ? '📤 Envoi' : tx.type === 'reception' ? '📥 Réception' : '🏧 Retrait'}</div>
                            <div style="font-size: 0.8rem; color: #86a6d4;">${date} · ${counterpartyShort}</div>
                        </div>
                        <div class="${cls}" style="font-weight: 600;">${sign}${tx.amount.toFixed(2)} €</div>
                    </div>
                `;
            }).join('');
        }

        // ---------- TOAST ----------
        function showToast(message, bgColor = '#1e3a5f') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.background = bgColor;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2800);
        }

        // ---------- DÉMARRAGE ----------
        render();

        window.addEventListener('load', () => {
            if (!walletData.users.some(u => u.email === DEMO_EMAIL)) {
                walletData.users.push({
                    id: 'u_demo',
                    email: DEMO_EMAIL,
                    password: DEMO_PASSWORD,
                    address: DEMO_ADDRESS,
                    balance: DEMO_BALANCE,
                    transactions: []
                });
                saveData(walletData);
                render();
            }
        });
    </script>
</body>
</html>
